name: Weekly DB Refresh

on:
  schedule:
    # Every Tuesday at 06:17 UTC (2:17 AM ET) — after Monday Night Football.
    # Goal is fresh data by ~7 AM ET, but GitHub's scheduler has been starting
    # these 4-7 hours late, so this is set early to absorb that lag. Off the
    # :00 mark since that's when scheduled runs queue up the worst.
    - cron: '17 6 * * 2'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy-analyzer

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed to merge into staging below

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: fantasy-analyzer/requirements.txt

      # Cache players.json by ISO week so it's refreshed weekly but reused within a week.
      # Cache miss = ingest downloads fresh copy; cache hit = skip the 10MB download.
      - name: Get ISO week
        id: week
        run: echo "key=players-$(date -u +'%Y-W%V')" >> "$GITHUB_OUTPUT"

      - name: Cache player data
        uses: actions/cache@v4
        with:
          path: fantasy-analyzer/data/players.json
          key: ${{ steps.week.outputs.key }}
          restore-keys: players-

      - name: Install dependencies
        run: pip install -e .

      - name: Run ingest
        run: python -m fantasy_analyzer.cli ingest

      # Runs after ingest because the recap needs the just-scored week's matchups.
      # Same job (not a separate workflow) so there's one commit/push of league.db;
      # two workflows pushing the same binary DB at once reject each other.
      # continue-on-error so a scrape/Claude hiccup can't lose the ingested scores.
      - name: Scrape projections, refresh rosters, generate recap/preview
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m fantasy_analyzer.cli scrape-projections

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/league.db
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: weekly refresh + projections scrape $(date -u +'%Y-%m-%d')"

      - name: Push changes
        run: git push

      - name: Sync staging so it doesn't go stale
        if: github.ref_name == 'master'  # only meaningful when the cron/dispatch ran on master
        run: |
          git checkout staging
          git merge master --no-edit
          git push origin staging
